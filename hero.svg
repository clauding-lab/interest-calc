<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171c"/>
      <stop offset="0.55" stop-color="#1b1f28"/>
      <stop offset="1" stop-color="#1f2533"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.10" r="0.6">
      <stop offset="0" stop-color="#4d97f0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4d97f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ab0f7"/>
      <stop offset="1" stop-color="#3a7fd9" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="tile" x1="0.29" y1="0.05" x2="0.71" y2="0.95">
      <stop offset="0" stop-color="#2c2f34"/>
      <stop offset="0.6" stop-color="#1e2024"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
    <radialGradient id="tileSheen" cx="0.5" cy="-0.1" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tileClip"><rect x="64" y="104" width="88" height="88" rx="20"/></clipPath>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- right-side compounding-growth panel -->
  <g>
    <g stroke="#283247" stroke-width="1" opacity="0.7">
      <line x1="724" y1="104" x2="1136" y2="104"/>
      <line x1="724" y1="160" x2="1136" y2="160"/>
      <line x1="724" y1="216" x2="1136" y2="216"/>
      <line x1="724" y1="264" x2="1136" y2="264"/>
    </g>
    <g>
      <rect x="744"  y="224" width="48" height="40"  rx="5" fill="url(#bar)"/>
      <rect x="824"  y="194" width="48" height="70"  rx="5" fill="url(#bar)"/>
      <rect x="904"  y="156" width="48" height="108" rx="5" fill="url(#bar)"/>
      <rect x="984"  y="112" width="48" height="152" rx="5" fill="url(#bar)"/>
      <rect x="1064" y="64"  width="48" height="200" rx="5" fill="url(#bar)"/>
    </g>
    <path d="M 768 224 C 820 210, 848 194, 928 156 S 1040 100, 1088 64" fill="none" stroke="#bcd9ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1088" cy="64" r="4.5" fill="#bcd9ff"/>
  </g>

  <!-- left content -->
  <rect x="64" y="60" width="52" height="3" fill="#4d97f0"/>
  <text x="64" y="88" font-size="13.5" letter-spacing="2.5" fill="#8aa0c4">DEPOSIT · LOAN · EMI · INTEREST — BANGLADESH</text>

  <!-- %↑ app-icon tile -->
  <g clip-path="url(#tileClip)">
    <rect x="64" y="104" width="88" height="88" fill="url(#tile)"/>
    <rect x="64" y="104" width="88" height="88" fill="url(#tileSheen)"/>
    <g transform="translate(64,104) scale(0.733)" fill="none" stroke-linecap="round">
      <path d="M36 86 L84 32" stroke="#eef1f6" stroke-width="10"/>
      <path d="M66 32 H84 V50" stroke="#4d97f0" stroke-width="11" stroke-linejoin="round"/>
      <circle cx="42" cy="40" r="10" fill="#eef1f6" stroke="none"/>
      <circle cx="78" cy="80" r="10" fill="#eef1f6" stroke="none"/>
    </g>
  </g>
  <rect x="64.5" y="104.5" width="87" height="87" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>

  <!-- wordmark -->
  <text x="172" y="170" font-size="64" font-weight="700" fill="#F4F7FC">In<tspan fill="#5aa0f5">Calc</tspan></text>

  <text x="64" y="230" font-size="22" fill="#C3D0E6">Bank-grade deposit, loan &amp; EMI math — built for Bangladesh.</text>
  <text x="64" y="298" font-size="14.5" fill="#7E92B4">incalc.clauding-lab.com</text>
  <text x="700" y="300" text-anchor="end" font-size="12.5" letter-spacing="1.5" fill="#7E92B4">APP STORE · WEB PWA</text>
</svg>
