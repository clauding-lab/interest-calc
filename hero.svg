<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A3A"/>
      <stop offset="0.55" stop-color="#0E2247"/>
      <stop offset="1" stop-color="#102A55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.86" cy="0.10" r="0.6">
      <stop offset="0" stop-color="#E8B04B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0C667"/>
      <stop offset="1" stop-color="#E8B04B" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- right-side compounding-growth panel -->
  <g>
    <!-- faint chart gridlines -->
    <g stroke="#21345C" stroke-width="1" opacity="0.7">
      <line x1="724" y1="104" x2="1136" y2="104"/>
      <line x1="724" y1="160" x2="1136" y2="160"/>
      <line x1="724" y1="216" x2="1136" y2="216"/>
      <line x1="724" y1="264" x2="1136" y2="264"/>
    </g>
    <!-- ascending bars: principal compounding over time -->
    <g>
      <rect x="744"  y="224" width="48" height="40"  rx="5" fill="url(#bar)"/>
      <rect x="824"  y="194" width="48" height="70"  rx="5" fill="url(#bar)"/>
      <rect x="904"  y="156" width="48" height="108" rx="5" fill="url(#bar)"/>
      <rect x="984"  y="112" width="48" height="152" rx="5" fill="url(#bar)"/>
      <rect x="1064" y="64"  width="48" height="200" rx="5" fill="url(#bar)"/>
    </g>
    <!-- growth curve riding the bar tops -->
    <path d="M 768 224 C 820 210, 848 194, 928 156 S 1040 100, 1088 64" fill="none" stroke="#F4D58A" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1088" cy="64" r="4.5" fill="#F4D58A"/>
  </g>

  <!-- left content -->
  <rect x="64" y="68" width="52" height="3" fill="#E8B04B"/>
  <text x="64" y="99" font-size="13.5" letter-spacing="2.5" fill="#7E92B4">DEPOSIT · LOAN · EMI · INTEREST — BANGLADESH</text>
  <text x="61" y="184" font-size="76" font-weight="700" fill="#F4F7FC">In<tspan fill="#E8B04B">Calc</tspan></text>
  <text x="64" y="230" font-size="22" fill="#C3D0E6">Bank-grade deposit, loan &amp; EMI math — built for Bangladesh.</text>
  <text x="64" y="300" font-size="14.5" fill="#7E92B4">incalc.clauding-lab.com</text>
  <text x="700" y="300" text-anchor="end" font-size="12.5" letter-spacing="1.5" fill="#7E92B4">APP STORE · WEB PWA</text>
</svg>
